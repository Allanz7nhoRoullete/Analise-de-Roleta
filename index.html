<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Roleta Tracker Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎯 Roleta Tracker</h1>

<div id="roleta"></div>

<h2>📜 Histórico</h2>
<div id="historico"></div>

<h2>📊 Análises (clique para filtrar)</h2>

<div class="painel">

  <div class="bloco">
    <h3>Terminais</h3>
    <div id="terminais"></div>
  </div>

  <div class="bloco">
    <h3>Dúzias</h3>
    <div id="duzias"></div>
  </div>

  <div class="bloco">
    <h3>Regiões</h3>
    <div id="regioes"></div>
  </div>

  <div class="bloco">
    <h3>Colunas</h3>
    <div id="colunas"></div>
  </div>

</div>

<h2>🎯 Resultado do Filtro</h2>
<div id="filtro"></div>

<script src="script.js"></script>
</body>
</html>
